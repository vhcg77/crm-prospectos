<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{{ app_name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">{{ app_name }}</h1>
      <div>
        <a href="/kanban" class="mr-4 text-blue-600 hover:underline">Vista Kanban</a>
        <button hx-get="/ia/resumen-pipeline" hx-target="#modal-container" hx-swap="innerHTML" class="mr-2 border border-purple-300 bg-purple-50 text-purple-700 px-3 py-2 rounded hover:bg-purple-100">✨ Resumen IA</button>
        <button hx-get="/configuracion" hx-target="#modal-container" hx-swap="innerHTML" class="mr-2 border border-gray-300 bg-white text-gray-700 px-3 py-2 rounded hover:bg-gray-50">⚙️ Configuración</button>
        <button hx-get="/prospectos/nuevo" hx-target="#modal-container" hx-swap="innerHTML" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Nuevo Prospecto</button>
      </div>
    </div>
    
    <form id="search-form" class="flex gap-4 mb-6">
      <div class="relative flex-1">
        <svg class="w-5 h-5 absolute left-3 top-2.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input type="search" name="q" placeholder="Buscar por nombre o empresa..." 
               class="border border-gray-300 p-2 pl-10 rounded w-full shadow-sm focus:ring-blue-500 focus:border-blue-500" 
               hx-get="/prospectos/buscar" 
               hx-trigger="input changed delay:300ms, search" 
               hx-target="#prospectos-list" 
               hx-include="#search-form">
      </div>
      <select name="etapa" 
              class="border border-gray-300 p-2 rounded shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-white" 
              hx-get="/prospectos/buscar" 
              hx-trigger="change" 
              hx-target="#prospectos-list" 
              hx-include="#search-form">
        <option value="">Todas las etapas</option>
        {% for e in etapas %}
        <option value="{{ e }}">{{ e }}</option>
        {% endfor %}
      </select>
    </form>
    
    <table class="w-full bg-white rounded shadow text-left">
      <thead>
        <tr class="bg-gray-100 border-b">
          <th class="p-3">Nombre</th>
          <th class="p-3">Empresa</th>
          <th class="p-3">Valor</th>
          <th class="p-3">Etapa</th>
          <th class="p-3">Acciones</th>
        </tr>
      </thead>
      <tbody id="prospectos-list">
        {% include 'partials/prospectos_tbody.html' %}
      </tbody>
    </table>
  </div>
  <div id="modal-container"></div>
</body>
</html>
