<div id="modal-backdrop" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white p-6 rounded shadow-lg w-full max-w-lg">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold flex items-center gap-2">
        <span>✨</span> Resumen del Pipeline (IA)
      </h2>
      <button type="button" onclick="document.getElementById('modal-backdrop').remove()" class="text-gray-400 hover:text-gray-800">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    
    {% if error %}
    <div class="bg-rose-100 text-rose-800 p-4 rounded mb-4">
      {{ error }}
    </div>
    <div class="flex justify-end gap-2">
      <button type="button" onclick="document.getElementById('modal-backdrop').remove()" class="px-4 py-2 text-gray-600 hover:text-gray-800">Cerrar</button>
      <button hx-get="/configuracion" hx-target="#modal-backdrop" hx-swap="outerHTML" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Ir a Configuración</button>
    </div>
    {% else %}
    <div class="bg-purple-50 border border-purple-100 p-5 rounded-lg mb-4 text-purple-900 leading-relaxed">
      {{ resumen }}
    </div>
    <div class="flex justify-end gap-2">
      <button type="button" onclick="document.getElementById('modal-backdrop').remove()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded hover:bg-gray-200">Cerrar</button>
    </div>
    {% endif %}
  </div>
</div>
