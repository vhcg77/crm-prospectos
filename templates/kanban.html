<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Kanban — {{ app_name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2"></script>
</head>
<body class="bg-slate-50">
  <div class="p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Kanban — {{ app_name }}</h1>
      <a href="/" class="text-blue-600 hover:underline">&larr; Volver a lista</a>
    </div>
    
    <div class="grid grid-cols-5 gap-4">
      {% for etapa in etapas %}
      <div class="bg-gray-200 rounded-lg p-3">
        <h2 class="font-semibold text-gray-700 mb-3">{{ etapa }} <span class="text-sm font-normal text-gray-500">({{ columnas[etapa]|length }})</span></h2>
        
        <div class="min-h-[300px] flex flex-col gap-2 sortable-col" data-etapa="{{ etapa }}">
          {% for p in columnas[etapa] %}
          {% include 'partials/kanban_card.html' %}
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script>
    document.body.addEventListener('htmx:responseError', function(evt) {
      if (evt.detail.requestConfig.path.includes('/etapa')) {
        // En caso de error (ej. etapa inválida 400), recargamos para revertir visualmente al estado real del servidor
        window.location.reload();
      }
    });

    document.querySelectorAll('.sortable-col').forEach(col => {
      new Sortable(col, {
        group: 'kanban',
        animation: 150,
        onEnd: function (evt) {
          const itemEl = evt.item; 
          const prospectoId = itemEl.getAttribute('data-id');
          const nuevaEtapa = evt.to.getAttribute('data-etapa');
          
          if (evt.from !== evt.to) {
            htmx.ajax('POST', `/prospectos/${prospectoId}/etapa`, {
              values: { etapa: nuevaEtapa },
              target: itemEl,
              swap: 'outerHTML'
            });
          }
        }
      });
    });
  </script>
</body>
</html>
