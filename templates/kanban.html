<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Kanban — {{ app_name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2"></script>
</head>
<body class="bg-slate-50">
  <div class="p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Kanban — {{ app_name }}</h1>
      <div>
        <a href="/" class="mr-4 text-blue-600 hover:underline">Vista Lista</a>
        <button hx-get="/ia/resumen-pipeline" hx-target="#modal-container" hx-swap="innerHTML" class="mr-2 border border-purple-300 bg-purple-50 text-purple-700 px-3 py-2 rounded hover:bg-purple-100">✨ Resumen IA</button>
        <button hx-get="/configuracion" hx-target="#modal-container" hx-swap="innerHTML" class="mr-2 border border-gray-300 bg-white text-gray-700 px-3 py-2 rounded hover:bg-gray-50">⚙️ Configuración</button>
        <button hx-get="/prospectos/nuevo" hx-target="#modal-container" hx-swap="innerHTML" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Nuevo Prospecto</button>
      </div>
    </div>
    
    <div id="modal-container"></div>

    <div class="grid grid-cols-5 gap-4">
      {% for etapa in etapas %}
      <div class="bg-gray-200 rounded-lg p-3">
        {% include 'partials/kanban_col_header.html' %}
        
        <div class="min-h-[300px] flex flex-col gap-2 sortable-col" data-etapa="{{ etapa }}">
          {% for p in columnas[etapa] %}
          {% include 'partials/kanban_card.html' %}
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script>
    document.body.addEventListener('htmx:responseError', function(evt) {
      if (evt.detail.requestConfig.path.includes('/etapa')) {
        // En caso de error (ej. etapa inválida 400), recargamos para revertir visualmente al estado real del servidor
        window.location.reload();
      }
    });

    document.querySelectorAll('.sortable-col').forEach(col => {
      new Sortable(col, {
        group: 'kanban',
        animation: 150,
        onEnd: function (evt) {
          const itemEl = evt.item; 
          const prospectoId = itemEl.getAttribute('data-id');
          const nuevaEtapa = evt.to.getAttribute('data-etapa');
          
          if (evt.from !== evt.to) {
            htmx.ajax('POST', `/prospectos/${prospectoId}/etapa`, {
              values: { etapa: nuevaEtapa },
              target: itemEl,
              swap: 'outerHTML'
            });
          }
        }
      });
    });
  </script>
</body>
</html>
